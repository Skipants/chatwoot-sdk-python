[project]
name = "chatwoot-sdk-python"
version = "0.1.0"
description = "Python SDK for Chatwoot API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatwoot"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
